<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión — Sistema de Gestión de Pollos">
  <title>Iniciar Sesión — Gestión de Pollos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Brand - Premium Gold */
      --primary: #F59E0B;
      --primary-dark: #D97706;
      --primary-light: #FCD34D;
      
      /* Backgrounds - Liquid Dark Slate */
      --bg: #0B0F19; /* Deep, rich black-blue */
      --bg-card: rgba(19, 27, 44, 0.65);
      
      /* Text */
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      
      /* Status Colors */
      --danger: #EF4444;
      --success: #10B981;
      
      /* Borders & Glass */
      --border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(0,0,0,0.2);
      
      --radius: 16px;
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.6);
      --shadow-glow: 0 0 24px rgba(245,158,11,0.15);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(circle at 15% 50%, rgba(245,158,11,0.04), transparent 35%),
                        radial-gradient(circle at 85% 30%, rgba(56,189,248,0.03), transparent 35%);
      -webkit-font-smoothing: antialiased;
    }

    svg.icon {
      display: inline-block;
      vertical-align: middle;
      stroke-width: 2px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    /* Logo / Brand */
    .brand {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .brand__icon {
      font-size: 56px;
      display: block;
      margin-bottom: 12px;
      color: var(--primary);
      filter: drop-shadow(0 0 20px rgba(245,158,11,0.4));
    }
    .brand__title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .brand__subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      padding: 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .card__title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text);
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }
    .form-input:focus {
      background: rgba(0,0,0,0.4);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .form-input.error {
      border-color: var(--danger);
      background: rgba(239,68,68,0.05);
    }
    .form-input.error:focus {
      box-shadow: 0 0 0 3px rgba(239,68,68,0.15);
    }
    .form-input::placeholder { color: var(--text-muted); opacity: 0.5; }

    /* Password wrapper */
    .input-wrapper { position: relative; }
    .input-wrapper .form-input { padding-right: 44px; }
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
      padding: 4px;
      line-height: 1;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* Error message */
    .form-error {
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: 6px;
      min-height: 18px;
      display: block;
      font-weight: 500;
    }

    /* Alert */
    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease;
      font-weight: 500;
    }
    .alert--error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.2);  color: #FCA5A5; }
    .alert.hidden { display: none; }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: #000;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }
    .btn-login:active  { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(0,0,0,0.1);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    /* Theme toggle - Hidden to force premium dark mode */
    .theme-btn {
      display: none;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Animations */
    @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: none; } }
    @keyframes fadeUp   { from { opacity:0; transform: translateY(20px);  } to { opacity:1; transform: none; } }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <button class="theme-btn" id="themeToggle" title="Cambiar tema">🌙</button>

  <div class="login-wrapper">
    <div class="brand">
      <span class="brand__icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3"/><path d="M14 17.75V21"/><path d="M7 18a6 6 0 0 0 3.84-10.61"/></svg></span>
      <h1 class="brand__title">Gestión de Pollos</h1>
      <p class="brand__subtitle">Inventario & Control de Ventas</p>
    </div>

    <div class="card">
      <h2 class="card__title">Iniciar Sesión</h2>

      <div class="alert alert--error hidden" id="alertError" role="alert">
        <span>❌</span>
        <span id="alertMsg">Error al iniciar sesión</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            autofocus
            required
            maxlength="50"
            aria-describedby="errorUsername"
          >
          <span class="form-error" id="errorUsername" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
              maxlength="100"
              aria-describedby="errorPassword"
            >
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Mostrar contraseña" aria-pressed="false">👁️</button>
          </div>
          <span class="form-error" id="errorPassword" role="alert"></span>
        </div>

        <button type="submit" class="btn-login" id="btnLogin" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Ingresar al Sistema</span>
        </button>
      </form>
    </div>

    <p class="login-footer">
      🔒 Conexión segura — Sistema privado
    </p>
  </div>

  <script>
    // ========================
    // THEME
    // ========================
    const themeToggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('pollos-theme') || 'dark';
    if (saved === 'light') {
      document.body.setAttribute('data-theme', 'light');
      themeToggle.textContent = '☀️';
    }
    themeToggle.addEventListener('click', () => {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.body.removeAttribute('data-theme');
        themeToggle.textContent = '🌙';
        localStorage.setItem('pollos-theme', 'dark');
      } else {
        document.body.setAttribute('data-theme', 'light');
        themeToggle.textContent = '☀️';
        localStorage.setItem('pollos-theme', 'light');
      }
    });

    // ========================
    // PASSWORD TOGGLE
    // ========================
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('togglePw');
      if (pw.type === 'password') {
        pw.type = 'text';
        btn.textContent = '🙈';
        btn.setAttribute('aria-pressed', 'true');
      } else {
        pw.type = 'password';
        btn.textContent = '👁️';
        btn.setAttribute('aria-pressed', 'false');
      }
    });

    // ========================
    // LOGIN FORM
    // ========================
    const form    = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const alertBox = document.getElementById('alertError');
    const alertMsg = document.getElementById('alertMsg');

    // Si ya hay sesión activa, redirigir
    const token = localStorage.getItem('pollos-token');
    if (token) {
      window.location.replace('/');
    }

    function showAlert(msg) {
      alertMsg.textContent = msg;
      alertBox.classList.remove('hidden');
      alertBox.setAttribute('tabindex', '-1');
      alertBox.focus();
    }
    function hideAlert() { alertBox.classList.add('hidden'); }
    function setLoading(on) {
      btnLogin.disabled = on;
      btnLogin.classList.toggle('loading', on);
    }
    function clearErrors() {
      hideAlert();
      ['username','password'].forEach(f => {
        const el = document.getElementById(f);
        el.classList.remove('error');
        el.removeAttribute('aria-invalid');
        document.getElementById(`error${f.charAt(0).toUpperCase() + f.slice(1)}`).textContent = '';
      });
    }

    function showError(fieldId, msg) {
      const el = document.getElementById(fieldId);
      el.classList.add('error');
      el.setAttribute('aria-invalid', 'true');
      document.getElementById(`error${fieldId.charAt(0).toUpperCase() + fieldId.slice(1)}`).textContent = msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Validaciones simples del cliente
      let hasErr = false;
      let firstErrField = null;

      if (!username) {
        showError('username', 'El usuario es obligatorio');
        hasErr = true;
        firstErrField = 'username';
      }
      if (!password) {
        showError('password', 'La contraseña es obligatoria');
        hasErr = true;
        if (!firstErrField) firstErrField = 'password';
      }
      
      if (hasErr) {
        document.getElementById(firstErrField).focus();
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          // Guardar token y datos del usuario
          localStorage.setItem('pollos-token', data.token);
          localStorage.setItem('pollos-user', JSON.stringify(data.user));
          // Redirigir al dashboard
          window.location.replace('/');
        } else {
          const msg = (data.errors && data.errors[0]) || data.error || 'Error al iniciar sesión';
          showAlert(msg);
          const pwField = document.getElementById('password');
          pwField.value = '';
          pwField.focus();
        }
      } catch (err) {
        showAlert('Error de conexión. Verifica que el servidor esté activo.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
